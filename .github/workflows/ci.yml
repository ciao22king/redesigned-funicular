name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production (otherwise preview draft)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The app lives in skill-forge/, not at the repository root. Without this, every
# `npm` step runs in the root, finds no package.json and fails.
defaults:
  run:
    working-directory: skill-forge

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skill-forge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Fake values: the build makes no network calls to these services.
          # They only satisfy the check for missing variables.
          NEXTAUTH_SECRET: ci-only-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
          GITHUB_ID: ci-placeholder
          GITHUB_SECRET: ci-placeholder
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          OPENROUTER_API_KEY: ci-placeholder
          OPENROUTER_MODELS: nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3.5-super-vl:free,nvidia/nemotron-3.5-lightning:free,dots-studio/dots-3-note-preview:free,google/gemma-4-31b-it:free,recursive/flint-v1.0:free,google/gemma-4-26b-a4b-it:free,xingchen-agi/xing4.0-29b-a4b:free,cohere/north-mini-code:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,liquid/lfm-2.5-2.6b:free
