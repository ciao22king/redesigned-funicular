name: Deploy su Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy in produzione (altrimenti preview draft)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build di verifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Valori finti: la build non fa chiamate di rete a questi servizi.
          # Servono solo a soddisfare il controllo sulle variabili mancanti.
          NEXTAUTH_SECRET: ci-only-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
          GITHUB_ID: ci-placeholder
          GITHUB_SECRET: ci-placeholder
          TOKENHARBOR_BASE_URL: https://tokenharbor.ai/v1
          TOKENHARBOR_API_KEY: ci-placeholder
          TOKENHARBOR_MODEL: deepseek-v4.1-flash:free

  deploy:
    name: Deploy Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Deploy
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production }}" = "false" ]; then
            echo "Deploy preview (draft)"
            npx opennextjs-cloudflare build
            npx wrangler versions upload
          else
            echo "Deploy in produzione"
            npm run deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GITHUB_ID: ${{ secrets.GH_OAUTH_ID }}
          GITHUB_SECRET: ${{ secrets.GH_OAUTH_SECRET }}
          TOKENHARBOR_BASE_URL: ${{ secrets.TOKENHARBOR_BASE_URL }}
          TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
          TOKENHARBOR_MODEL: ${{ secrets.TOKENHARBOR_MODEL }}
